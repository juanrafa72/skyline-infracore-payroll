[build]
  # Las migraciones se aplican en cada despliegue: la base publicada siempre
  # tiene la misma estructura que el código. El seed usa upsert, así que
  # repetirlo no duplica nada.
  command = "npx prisma generate && npx prisma migrate deploy && npx tsx prisma/seed.ts && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
